<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Professional Resume of Mukhyaprana - Software Engineering & Computer Science">
  <title>Mukhyaprana | Resume</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0f172a;
      --secondary-hover: #334155;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0b0f19;
        --card-bg: #111827;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --border-color: #1f2937;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --secondary: #f9fafb;
        --secondary-hover: #e5e7eb;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
      transition: box-shadow 0.2s ease;
    }

    .hero-card:hover {
      box-shadow: var(--shadow-lg);
    }

    .name-title {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .heading-subtitle {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }

    .description {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 1.5rem auto;
    }

    .actions-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.25;
    }

    .btn-view {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-view:hover {
      background-color: var(--primary);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-download {
      background-color: var(--primary);
      color: #ffffff;
      border: 2px solid var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn-download:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 1.125rem;
      height: 1.125rem;
      fill: currentColor;
    }

    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-header {
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .preview-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    .pdf-viewer-container {
      width: 100%;
      height: 900px;
      background-color: #525659;
      position: relative;
    }

    .pdf-viewer-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .pdf-fallback {
      display: none;
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem 0.75rem;
      }

      .hero-card {
        padding: 1.5rem 1rem;
      }

      .name-title {
        font-size: 1.75rem;
      }

      .heading-subtitle {
        font-size: 1.1rem;
      }

      .actions-group {
        flex-direction: column;
        width: 100%;
      }

      .btn {
        width: 100%;
      }

      .pdf-viewer-container {
        height: 600px;
      }
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero-card">
      <h1 class="name-title">Mukhyaprana</h1>
      <h2 class="heading-subtitle">Professional Resume</h2>
      <p class="description">
        Access the complete curriculum vitae outlining professional experience, technical skills, education, and notable engineering projects.
      </p>

      <nav class="actions-group" aria-label="Resume Actions">
        <a href="/Mukhyaprana_Resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-view">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
          View Resume
        </a>

        <a href="/Mukhyaprana_Resume.pdf" download="Mukhyaprana_Resume.pdf" class="btn btn-download" role="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
          </svg>
          Download Resume
        </a>
      </nav>
    </header>

    <main class="preview-card" aria-label="Resume Document Preview">
      <div class="preview-header">
        <span class="preview-indicator">
          <span class="status-dot"></span>
          Live Document Preview
        </span>
        <span>Mukhyaprana_Resume.pdf</span>
      </div>
      <div class="pdf-viewer-container">
        <iframe src="/Mukhyaprana_Resume.pdf" title="Mukhyaprana Professional Resume PDF">
          <div class="pdf-fallback">
            <p>Your browser does not support inline PDF viewing.</p>
            <p>Please use the <a href="/Mukhyaprana_Resume.pdf" target="_blank">View Resume</a> or <a href="/Mukhyaprana_Resume.pdf" download="Mukhyaprana_Resume.pdf">Download Resume</a> buttons above to view the document.</p>
          </div>
        </iframe>
      </div>
    </main>

    <footer>
      <p>&copy; Mukhyaprana &bull; Hosted with Vercel</p>
    </footer>
  </div>
</body>
</html>
